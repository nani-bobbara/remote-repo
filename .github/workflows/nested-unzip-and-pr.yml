# =============================================================================
# Zip Upload -> Repo Sync & PR
# =============================================================================
# What this does, for each zip file added to the root of THIS repo (the
# staging registry), named "<target-repo-name>.<version>.zip":
#
#   1. Validate the filename against the naming convention. A non-matching
#      zip is skipped (left in place, nothing else happens).
#   2. Look up the target repo by exact name (strict match).
#        - Repo EXISTS:
#            a. Create a feature branch (sync-<version>).
#            b. Unzip the upload and push its contents onto that branch.
#            c. Open a pull request from that branch into "main".
#        - Repo does NOT exist:
#            a. Create it (private).
#            b. Unzip the upload and push its contents straight to "main"
#               (a brand-new repo has nothing to protect, so no PR needed).
#   3. Either way, once delivery succeeds, delete the processed zip from
#      this staging repo.
#
# Filename convention (see README.md):
#   demo-one.001.zip  -> target repo "demo-one", version label "001"
#
# Required one-time setup:
#   - Secret TARGET_REPO_TOKEN: a GitHub Personal Access Token (classic or
#     fine-grained) with permission to create repos and push/open PRs in the
#     target repos. The built-in GITHUB_TOKEN can only act on THIS repo, so a
#     PAT is required to reach other repos in the account/org.
#   - Target repos are created under the same account/org that owns this
#     staging repo (github.repository_owner) -- no username to hardcode.
#
# Re-running with the same version label against an EXISTING repo (e.g.
# re-uploading demo-one.001.zip) resets the same branch/PR rather than
# creating a duplicate -- see the "force push" note below.
# =============================================================================

name: Zip Upload - Repo Sync & PR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # Only matches zip files at the REPO ROOT (flat layout). If you want to
      # allow zips in subfolders too, change this to '**/*.zip'.
      - '*.zip'

# Needed so this workflow can commit the "delete processed zip" cleanup
# directly to this repo's main branch using the built-in GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  sync-uploaded-zips:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------------
      # 1. Check out the staging registry (this repo) so we can read the zip
      #    files and later commit the cleanup deletion.
      # ---------------------------------------------------------------------
      - name: Checkout staging registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff what was added

      # ---------------------------------------------------------------------
      # 2. Figure out which zip file(s) were newly ADDED by this push.
      #    --diff-filter=A excludes deletions, so the cleanup commit made in
      #    step 7 (which deletes a zip) never re-triggers processing here.
      # ---------------------------------------------------------------------
      - name: Discover newly added zip files
        id: discover
        run: |
          ADDED_ZIPS=$(git diff --name-only --diff-filter=A HEAD^ HEAD -- '*.zip' || true)

          if [ -z "$ADDED_ZIPS" ]; then
            echo "No new zip files in this push. Nothing to do."
            echo "has_zips=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_zips=true" >> "$GITHUB_OUTPUT"
          echo "Added zip files:"
          echo "$ADDED_ZIPS"

          # Pass the multi-line list to later steps via a temp file
          # (env vars/outputs can't safely hold multiple lines with spaces).
          echo "$ADDED_ZIPS" > added_zips.txt

      # ---------------------------------------------------------------------
      # 3. Process each added zip file, one at a time, in this single job.
      #    A plain loop (rather than a parallel matrix) keeps this simple and
      #    avoids multiple jobs racing to push the cleanup commit in step 4
      #    to the same main branch at the same time.
      # ---------------------------------------------------------------------
      - name: Process each zip and deliver it to its target repo
        if: steps.discover.outputs.has_zips == 'true'
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          while IFS= read -r ZIP_PATH; do
            [ -z "$ZIP_PATH" ] && continue
            echo "::group::Processing $ZIP_PATH"

            # --- Step 1: validate "<repo-name>.<version>.zip" ---------------
            ZIP_FILE_NAME=$(basename "$ZIP_PATH")
            BASENAME="${ZIP_FILE_NAME%.zip}"
            VERSION="${BASENAME##*.}"
            TARGET_REPO="${BASENAME%.*}"

            if [ "$TARGET_REPO" = "$BASENAME" ] || [ -z "$VERSION" ] || [ -z "$TARGET_REPO" ]; then
              echo "Skipping '$ZIP_FILE_NAME': doesn't match '<repo-name>.<version>.zip'."
              echo "::endgroup::"
              continue
            fi

            WORKDIR="target_repo_dir_${VERSION}"
            EXTRACT_DIR="extracted_${VERSION}"
            DELIVERED="false"

            echo "Target repo: $OWNER/$TARGET_REPO | version: $VERSION"

            # --- Step 2: strict lookup of the target repo by exact name -----
            if gh repo view "$OWNER/$TARGET_REPO" > /dev/null 2>&1; then

              # ---------------------------------------------------------
              # Repo EXISTS -> feature branch + PR
              # ---------------------------------------------------------
              echo "Repo $OWNER/$TARGET_REPO already exists. Delivering via a feature branch + PR."
              BRANCH_NAME="sync-${VERSION}"

              gh repo clone "$OWNER/$TARGET_REPO" "$WORKDIR" -- --quiet
              cd "$WORKDIR"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              # Create (or reset, if this version was already uploaded before)
              # the branch for this upload.
              git checkout -B "$BRANCH_NAME"

              mkdir -p "../${EXTRACT_DIR}"
              unzip -q "../${ZIP_PATH}" -d "../${EXTRACT_DIR}"

              # Replace the branch contents with the newly uploaded code,
              # keeping .git intact.
              find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' -exec rm -rf {} +
              cp -r "../${EXTRACT_DIR}/." .

              git add -A
              if git diff --cached --quiet; then
                echo "Nothing changed for $TARGET_REPO at version $VERSION; skipping commit/PR."
              else
                git commit -m "Sync ${TARGET_REPO} - version ${VERSION}"

                # Force-push is safe here: this branch exists only to carry
                # this one upload's PR, so re-uploading the same version
                # intentionally replaces its contents rather than piling up
                # duplicate commits.
                git push origin "$BRANCH_NAME" --force

                gh pr create \
                  --repo "$OWNER/$TARGET_REPO" \
                  --head "$BRANCH_NAME" \
                  --base main \
                  --title "Sync ${TARGET_REPO} - version ${VERSION}" \
                  --body "Automated PR from staging upload \`${ZIP_FILE_NAME}\`." \
                  || echo "PR already exists for branch $BRANCH_NAME; skipping creation."
              fi
              cd ..
              DELIVERED="true"

            else

              # ---------------------------------------------------------
              # Repo does NOT exist -> create it, push straight to main
              # ---------------------------------------------------------
              echo "Repo $OWNER/$TARGET_REPO not found. Creating it as private."
              gh repo create "$OWNER/$TARGET_REPO" --private --add-readme
              sleep 5 # give the GitHub API a moment to finish provisioning

              gh repo clone "$OWNER/$TARGET_REPO" "$WORKDIR" -- --quiet
              cd "$WORKDIR"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              mkdir -p "../${EXTRACT_DIR}"
              unzip -q "../${ZIP_PATH}" -d "../${EXTRACT_DIR}"

              # A brand-new repo has nothing to protect, so the upload lands
              # directly on main -- no feature branch or PR needed.
              find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' -exec rm -rf {} +
              cp -r "../${EXTRACT_DIR}/." .

              git add -A
              if git diff --cached --quiet; then
                echo "Nothing to push for $TARGET_REPO at version $VERSION."
              else
                git commit -m "Initial sync ${TARGET_REPO} - version ${VERSION}"
                git push origin main
              fi
              cd ..
              DELIVERED="true"
            fi

            # --- Step 3: cleanup, only after a successful delivery ----------
            # [skip ci] prevents this commit from re-triggering this workflow
            # (belt-and-suspenders alongside the --diff-filter=A check above).
            if [ "$DELIVERED" = "true" ]; then
              git rm --quiet "$ZIP_PATH"
              git commit -m "Remove processed zip: ${ZIP_FILE_NAME} [skip ci]"
              git push origin main
            fi

            echo "::endgroup::"
          done < added_zips.txt